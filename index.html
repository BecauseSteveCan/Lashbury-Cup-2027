<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/lashbury-cup-icon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/lashbury-cup-icon.png">
<title>The Lashbury Cup 2027</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a65;--bd:#e2e0d8;--ac:#1d1d1b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#f2f1ec;--mu:#9b9a93;--bd:#383836;--ac:#f2f1ec}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#f2f1ec;--mu:#9b9a93;--bd:#383836;--ac:#f2f1ec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 4px;font:inherit;font-size:13px}
nav button.on{color:var(--tx);font-weight:700}
button.b,a.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;margin:2px 2px 2px 0}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px;max-width:100%}
textarea{width:100%;min-height:90px}
.score{display:flex;gap:10px;margin:0 0 10px}.score>div{flex:1;min-width:0;box-sizing:border-box;border-radius:12px;padding:14px;color:#fff;text-align:center}
.score b{font-size:34px;display:block}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m{border-top:1px solid var(--bd);padding:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:20px;padding:1px 7px;color:var(--mu)}
h1,h2,.score b,.pod b{font-family:Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:.4px}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}button.b{border-radius:20px}
.banner{text-align:center;padding:10px 0 12px;margin-bottom:12px;border-bottom:4px solid;border-image:var(--g) 1}
.banner img{width:200px;max-width:60%;display:block;margin:0 auto 6px}
.score>div{border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.2)}.score b{font-size:46px;line-height:1.1}
.tug{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0 4px}.tug i{display:block;transition:width .6s}
.hero{border:2px solid var(--ac)}.hl{background:rgba(255,200,0,.18);border-radius:8px;padding-left:6px;border-left:4px solid #e8a800}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .b{flex:1;text-align:center}
nav button{font-size:10px;padding:7px 0;min-width:0}.lu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pc{text-align:center;font-size:13px}.pc img,.av{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 4px;display:block}.av{display:grid;place-items:center;color:#fff;font:700 32px Oswald,sans-serif}.cd{font:700 34px Oswald,Impact,sans-serif;letter-spacing:1px}.drw{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 25%,#34122a,#05050a);color:#fff;overflow:auto;padding:28px 14px;text-align:center}.drwt{font:700 40px Oswald,Impact,sans-serif;letter-spacing:5px;animation:pulse .9s infinite alternate}.drwb{font:700 44px Oswald,Impact,sans-serif;min-height:72px;margin:16px 0;color:#ffd24a;word-break:break-word}.di{font:600 20px Oswald,sans-serif;padding:10px;margin:9px auto;max-width:440px;border:2px solid #ffffff30;border-radius:14px;background:#ffffff12;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.2) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}@keyframes pulse{to{text-shadow:0 0 24px #ffd24a;transform:scale(1.05)}}.pod{display:flex;gap:8px;align-items:flex-end;margin:8px 0 14px}.pod>div{flex:1;text-align:center;border-radius:12px 12px 0 0;background:var(--card);border:1px solid var(--bd);padding:8px 4px}
.pod b{display:block;font-size:17px}.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
video{width:100%;border-radius:14px;background:#000}

.welcome-hero{padding:18px 14px;margin-bottom:10px}.welcome-hero img{max-width:230px;width:70%;height:auto;margin:auto}.countdown-card{text-align:center}.countdown{font-size:38px;font-weight:800;letter-spacing:1px;margin:5px 0}.progress{height:10px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-grid .b{width:100%}
.app-install{display:flex;align-items:center;gap:12px;justify-content:center;text-align:left;padding:12px 14px}.app-install img{width:52px;height:52px;border-radius:12px;object-fit:cover}.app-install .b{margin:0}.install-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:20px}.install-modal .card{max-width:360px;width:100%;text-align:center}.install-modal img{width:82px;height:82px;border-radius:18px;margin:4px auto 10px;display:block}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
let S={teams:[{name:"Red Team",color:"#d64545",players:[]},{name:"Blue Team",color:"#2f6fd6",players:[]}],events:[],feed:[]};
let tab="welcome",plEd="",ref=true,admin=false,owner=false,myTeam=null,live=true,timer=null,sig="",loaded=true,gateErr=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TYPES={single:"Singles",double:"Doubles",team:"Team"};

let dirty=false;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function status(){
  let el=$("#st");if(!el){el=document.createElement("div");el.id="st";el.style.cssText="position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--mu);z-index:9";document.body.appendChild(el)}
  if(!admin||!ref){if(!navigator.onLine){el.style.display="block";el.textContent="📴 Offline – showing last saved data"}else el.style.display="none";return}
  el.style.display="block";el.textContent=dirty?(ERR?"⚠️ Not saved ("+ERR+") – check admin token":"⏳ Not synced yet – will send when signal returns"):(navigator.onLine?"✓ Synced":"📴 Offline – nothing waiting");
}
let ERR="";
function saveQuiet(){S.ts=Date.now();LS.set("tt_local",JSON.stringify({s:S,dirty:admin&&!!ref}));if(!ref)return;dirty=true;status();clearTimeout(timer);timer=setTimeout(push,1500)}
function save(){
  S.ts=Date.now();render();
  LS.set("tt_local",JSON.stringify({s:S,dirty:admin&&!!ref}));
  if(!ref)return;
  dirty=true;status();
  clearTimeout(timer);timer=setTimeout(push,400);
}
function push(){
  if(!ref||!dirty)return;
  const j=JSON.stringify(S);sig=j;
  ghPut(j).then(out=>{
    if(JSON.stringify(S)===j||JSON.stringify(S)===out){dirty=false;ERR="";LS.set("tt_local",JSON.stringify({s:S,dirty:false}))}
    status()}).catch(e=>{ERR=e.message||"error";status()});
}
setInterval(push,8000);
addEventListener("online",push);addEventListener("online",()=>status());addEventListener("offline",()=>status());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)push()});
const RR=["Table Tennis","Badminton","Foot-golf","Short Tennis","Bowls","Snooker","Darts","Ten Pin Bowling","Killer Skittles","Mini Golf","Adventure Golf","Can-Off","Mölkky"];
function rr(e){
  const m=new Map();
  (e.matches||[]).filter(x=>e.fmt!=="ss"||x.k==="p").forEach(x=>[[0,x.a],[1,x.b]].forEach(([sd,me])=>{
    const k=sd+"|"+me.join(" & "),r=m.get(k)||{team:sd,name:me.join(" & "),k,w:0,l:0,n:0,tot:0};
    r.tot++;if(x.w===sd)r.w++;else if(x.w===1-sd)r.l++;if(x.w===0||x.w===1)r.n++;m.set(k,r)}));
  return [...m.values()].map(r=>{
    const po=(e.po||{})[r.k];
    r.st=r.w*2>r.tot?"point":r.n<r.tot?"pending":r.w*2===r.tot?(po===true?"point":po===false?"no":"playoff"):"no";
    return r});
}
function evScore(e){const t=[0,0],P=+e.points||0;
  if(e.fmt==="rr"||e.fmt==="ss")rr(e).forEach(r=>{if(r.st==="point")t[r.team]+=P});
  if(e.fmt==="ss")(e.matches||[]).forEach(m=>{if(m.k!=="p"&&(m.w===0||m.w===1))t[m.w]+=P});
  else if(e.fmt!=="rr")(e.matches||[]).forEach(m=>{if(m.w==="d"){t[0]+=P/2;t[1]+=P/2}else if(m.w===0||m.w===1)t[m.w]+=P});
  return t}
let TB=false;
function pts(){const t=[0,0];S.events.forEach(e=>{if(!e.spurs){const q=evScore(e);t[0]+=q[0];t[1]+=q[1]}});TB=false;return t}
function wa(text){window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
function post(text){S.feed.unshift({id:uid(),t:Date.now(),text});S.feed=S.feed.slice(0,100)}
function leagueText(){const p=pts();return `🏆 League update\n${S.teams.map((t,i)=>`${t.name}: ${p[i]}`).join("\n")}`}
function draw(e){const q=e.link?S.events.find(x=>x.id===e.link):null;
  const [A,B]=S.teams.map(t=>shuf(t.players));
  if(e.fmt==="ss"){const n=(S.nom||{})[e.id]||[[],[]];
    if(n.some(t=>(t||[]).filter(Boolean).length<2||t[0]===t[1])){alert("Nominate 2 different singles per team first");return}
    const rest=S.teams.map((t,i)=>shuf(t.players.filter(p=>!n[i].includes(p)))),pa=[0,1].map(i=>{const r=[];for(let j=0;j+2<=rest[i].length;j+=2)r.push(rest[i].slice(j,j+2));return r}),m=[];
    n[0].forEach(a=>n[1].forEach(b=>m.push({a:[a],b:[b],w:null,k:"s"})));m.push({a:[...n[0]],b:[...n[1]],w:null,k:"sd"});
    pa[0].forEach(a=>pa[1].forEach(b=>m.push({a,b,w:null,k:"p"})));e.matches=m;e.po={}}
  else if(e.fmt==="rr"){const k=e.size||(e.type==="double"?2:1),ea=[],eb=[];for(let i=0;i+k<=A.length;i+=k)ea.push(A.slice(i,i+k));for(let i=0;i+k<=B.length;i+=k)eb.push(B.slice(i,i+k));e.matches=ea.flatMap(a=>eb.map(b=>({a,b,w:null})));e.po={}}
  else if(e.type==="team"&&!e.size)e.matches=[{a:A,b:B,w:null}];
  else{
    const k=e.size||(e.type==="double"?2:1),m=[];
    for(let i=0;i+k<=Math.min(A.length,B.length);i+=k)m.push({a:A.slice(i,i+k),b:B.slice(i,i+k),w:null});
    e.matches=m;
  }
  if(q){q.matches=e.matches.map(m=>({...m,a:[...m.a],b:[...m.b],w:null}));q.po={}}post(`🎲 Draw made for ${e.name}${q?" & "+q.name:""}!\n`+((e.fmt==="rr"||e.fmt==="ss")?rr(e).map(r=>`${S.teams[r.team].name}: ${r.name}`):e.matches.map(m=>`${m.a.join(" & ")} v ${m.b.join(" & ")}`)).join("\n"));
  save();
}
function result(id,i,w){const e=S.events.find(x=>x.id===id);if(!e)return;
  const m=e.matches[i];m.w=m.w===w?null:w;
  if(m.w!==null){
    const lbl=m.w==="d"?"Draw":S.teams[m.w].name+" win";
    post(`✅ ${e.name}: ${m.a.join(" & ")} v ${m.b.join(" & ")} — ${lbl}\n${leagueText()}`);
  }
  save();
}
const fmt=e=>[e.day?"Day "+e.day:"",e.time||"",e.venue||""].filter(Boolean).join(" · ");

function potdBlock(){return "";}
function dupWarn(){
  const seen={},dups=[];
  S.events.forEach(e=>{const k=(e.name||"").trim().toLowerCase();if(!k)return;(seen[k]??=[]).push(e.name)});
  Object.values(seen).forEach(a=>{if(a.length>1)dups.push(a[0]+" ×"+a.length)});
  return dups.length?`<div class="card"><b>⚠️ Duplicate events</b><div class="mu">${esc(dups.join(", "))}</div></div>`:"";
}
function spBlock(e){
  if(!e.spurs)return "";
  const sp=e.sp||{};
  return `<div class="m mu">⚽ Spurs predictions${sp.slots?.length?` — ${sp.slots.length} prediction slots`:""}</div>`;
}
function mvpBlock(e){
  if(!S.mvp||!S.mvp[e.id])return "";
  return `<div class="m mu">⭐ MVP picks recorded for this event.</div>`;
}
function clearEvent(id){
  if(!owner)return;
  const e=S.events.find(x=>x.id===id);if(!e)return;
  if(!confirm("Clear this draw and all results?"))return;
  e.matches=[];delete e.sp;delete e.nom;delete e.po;S.nom=S.nom||{};delete S.nom[id];save();
}
function replayDraw(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  alert((e.matches?.length?"Draw is already visible below.":"No draw has been made yet."));
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lashbury-cup-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyBackup(){
  const t=JSON.stringify(S,null,2);
  try{await navigator.clipboard.writeText(t);alert("Backup copied to clipboard.")}catch(e){const b=$("#bk");b.value=t;b.focus();b.select();alert("Clipboard access was unavailable, so the backup has been placed in the box below.")}
}
function restoreBackup(){
  if(!owner)return;
  try{
    const raw=$("#bk").value.trim();if(!raw)return;
    const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.teams)||!Array.isArray(d.events))throw new Error("Invalid Lashbury backup");
    if(!confirm("Restore this backup and replace the current tournament data?"))return;
    S=d;save();
  }catch(e){alert(e.message||"Could not restore backup.")}
}
function vLeague(){
  const p=pts();
  const done=S.events.filter(e=>e.matches?.length&&e.matches.every(m=>m.w!==null)).length;
  return `<div class="banner" style="--g:linear-gradient(90deg,${S.teams[0].color},${S.teams[1].color})"><img src="${LOGO}" alt="The Lashbury Cup 2027"><div class="mu">${DOW(dates()[0])} ${uk(dates()[0])} – ${DOW(dates()[1])} ${uk(dates()[1])}</div><div class="mu">Last updated ${lu()}</div></div><div class="score">${S.teams.map((t,i)=>`<div style="background:${esc(t.color)}">${esc(t.name)}<b>${p[i]}</b></div>`).join("")}</div>
  <div class="tug"><i style="width:${p[0]+p[1]?100*p[0]/(p[0]+p[1]):50}%;background:${S.teams[0].color}"></i><i style="flex:1;background:${S.teams[1].color}"></i></div>${TB?`<div class="mu" style="text-align:center">⚖️ Level after every other event. Spurs predictions tie-breaker applied.</div>`:""}<p class="mu">${done} of ${S.events.filter(e=>!e.pub).length} events complete</p>
  ${potdBlock()}${nextBlock()}${timetable()}
  ${S.events.filter(e=>e.matches?.some(m=>m.w!==null)).map(e=>`<div class="card"><h2>${ic(e.name)} ${esc(e.name)} ${isDone(e)?"✅":""} <span class="tag">${e.points} pts</span></h2>${e.fmt==="rr"?rr(e).map(r=>`<div class="mu">${esc(S.teams[r.team].name)}: ${esc(r.name)} — ${r.w}/${r.tot} ${r.st==="point"?"✅":r.st==="playoff"?"⚖️ playoff":""}</div>`).join(""):e.matches.map(m=>`<div class="mu">${esc(m.a.join(" & "))} v ${esc(m.b.join(" & "))} → <b>${m.w===null?"pending":m.w==="d"?"Draw":esc(S.teams[m.w].name)}</b></div>`).join("")}</div>`).join("")}`;
}
function vEvents(){
  const ev=[...S.events].filter(e=>!e.pub).sort((a,b)=>(a.day||9)-(b.day||9)||((span(a.time)||[1e4])[0]-(span(b.time)||[1e4])[0]));
  let h="<h1>Results</h1>";
  if(owner)h+=`<div class="card"><h2>Add event</h2><div class="row"><input id="en" placeholder="Event name" style="flex:2"><select id="et"><option value="single">Singles</option><option value="double">Doubles</option><option value="team">Team</option></select></div>
  <div class="row" style="margin-top:6px"><input id="ep" type="number" step="0.5" placeholder="Points" style="width:80px"><input id="ed" type="number" placeholder="Day" style="width:70px"><input id="eh" type="time"><button class="b p" onclick="addEv()">Add</button></div><div class="mu">Points are per match won (halved each for a draw).</div></div>`;
  if(!ev.length)h+=`<p class="mu">No events yet.</p>`+(owner?`<button class="b p" onclick="seed()">Load 2026 itinerary</button>`:"");
  return h+ev.map(e=>`<div class="card"><h2>${ic(e.name)} ${esc(e.name)} ${isDone(e)?"✅":""} ${(()=>{const q=evPts(e);return q[0]+q[1]?`<span class="tag" style="background:${S.teams[q[0]===q[1]?0:q[0]>q[1]?0:1].color};color:#fff;border:0">${q[0]===q[1]?"Tied":S.teams[q[0]>q[1]?0:1].name} ${q[0]}–${q[1]}</span>`:""})()}</h2><div class="row mu">${owner?`<select onchange="setType('${e.id}',this.value)">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===e.type?"selected":""}>${v}</option>`).join("")}</select>`:`<span class="tag">${TYPES[e.type]}</span>`}<span>${esc(fmt(e))}</span>${e.size?`<span class="tag">${e.size}v${e.size}</span>`:""}
  ${owner?`<select onchange="setFmt('${e.id}',this.value)">${[["","Standard"],["rr","Round robin"],["ss","Singles + pairs"]].map(([k,v])=>`<option value="${k}" ${(e.fmt||"")===k?"selected":""}>${v}</option>`).join("")}</select>`:(e.fmt==="rr"?`<span class="tag">Round robin</span>`:e.fmt==="ss"?`<span class="tag">Singles + pairs</span>`:"")}
  ${owner?`<label>per side <input type="number" min="1" max="8" value="${e.size||""}" placeholder="–" style="width:50px" onchange="setSize('${e.id}',this.value)"></label>`:""}
  ${owner?`<span>· pts <input type="number" step="0.5" value="${e.points}" style="width:64px" oninput="setPtsQ('${e.id}',this.value)" onchange="setPts('${e.id}',this.value)"></span>`:`<span>· ${e.points} pts</span>`}</div>${e.notes?`<div class="mu">${esc(e.notes)}</div>`:""}${e.link?`<div class="mu">🔗 Same draw as ${esc((S.events.find(x=>x.id===e.link)||{}).name||"")}</div>`:""}
  ${(e.matches?.length||(e.sp&&e.sp.slots&&e.sp.slots.length))?`<button class="b" onclick="replayDraw('${e.id}')">🎬 Replay draw reveal</button>`:""}${owner?editBlock(e):""}${spBlock(e)}${nomBlock(e)}${rrBlock(e)}${(e.fmt==="rr"||e.fmt==="ss")&&e.matches?.length?`<details ${OPEN.has(e.id)?"open":""} ontoggle="this.open?OPEN.add('${e.id}'):OPEN.delete('${e.id}')"><summary class='mu'>All matches</summary>`:""}${(e.matches||[]).map((m,i)=>`<div class="m"><span class="dot" style="background:${esc(S.teams[0].color)}"></span>${esc(m.a.join(" & "))} <span class="mu">v</span> <span class="dot" style="background:${esc(S.teams[1].color)}"></span>${esc(m.b.join(" & "))}

async function ghPut(j){
  const H={Authorization:"Bearer "+LS.get("tt_token"),Accept:"application/vnd.github+json"};
  let sha=null;const g=await fetch(API+"?ref="+gh.branch+"&t="+Date.now(),{headers:H});
  let out=j;
  if(g.ok){const gj=await g.json();sha=gj.sha;try{const R=JSON.parse(decodeURIComponent(escape(atob((gj.content||"").replace(/\n/g,"")))));if(R&&R.teams&&R.events)out=J(merge3(BASE?JSON.parse(BASE):undefined,JSON.parse(j),R))}catch(e){}}else if(g.status!==404)throw new Error("get "+g.status);
  const body={message:"Update tournament data",content:btoa(unescape(encodeURIComponent(out))),branch:gh.branch};if(sha)body.sha=sha;
  const p=await fetch(API,{method:"PUT",headers:H,body:JSON.stringify(body)});if(!p.ok)throw new Error("put "+p.status);BASE=out;LS.set("tt_base",out);sig=out;if(out!==j&&J(S)===j){S=JSON.parse(out);render(true)}return out}

    const d=JSON.parse(t);if(!d||!d.teams||!d.events)return;if(S.ts&&(d.ts||0)<=S.ts)return;S=d;sig=t;BASE=t;LS.set("tt_base",t);LS.set("tt_local",JSON.stringify({s:S,dirty:false}));render(true);migrate();status()}catch(e){}finally{clearTimeout(to);if(!loaded){loaded=true;render(true)}}}

function cdText(){const L=timed();if(!L.length)return"";const now=ukNow(),r=(L[0].s-now)*60-new Date().getSeconds(),end=L[L.length-1].en;
  if(r<=0)return now<end?"🔥 It's on!":"🏁 See you next year";
  const d=Math.floor(r/86400),h=Math.floor(r%86400/3600),m=Math.floor(r%3600/60),x=r%60,p=n=>String(n).padStart(2,"0");return `${d}d ${p(h)}h ${p(m)}m ${p(x)}s`}

function plSet(t,i,k,v){const n=S.teams[t].players[i];S.pl=S.pl||{};(S.pl[n]=S.pl[n]||{})[k]=v;saveQuiet()}

function plPhoto(t,i,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),m=Math.min(im.width,im.height);c.width=c.height=140;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/3,m,m,0,0,140,140);plSet(t,i,"p",c.toDataURL("image/jpeg",.65));render()};im.src=r.result};r.readAsDataURL(f)}
function lineup(){return S.teams.map((t,ti)=>`<div class="card"><h2 style="color:${esc(t.color)}">${esc(t.name)}</h2><div class="lu">${t.players.map((n,i)=>{const p=(S.pl||{})[n]||{},k=ti+"-"+i,ed=owner&&plEd===k;

  ${owner?`<a href="#" onclick="plEdit('${k}');return false">${ed?"Done":"✏️ Edit"}</a>`:""}
  ${ed?`<div style="text-align:left;margin-top:6px"><input value="${esc(n)}" placeholder="Name" style="width:100%;margin-bottom:4px" onchange="plRename(${ti},${i},this.value)"><input type="file" accept="image/*" onchange="plPhoto(${ti},${i},this)" style="width:100%"><input placeholder="Nickname" value="${esc(p.nick||"")}" style="width:100%;margin-top:4px" oninput="plSet(${ti},${i},'nick',this.value)"><textarea placeholder="Short bio" style="min-height:60px;margin-top:4px" oninput="plSet(${ti},${i},'b',this.value)">${esc(p.b||"")}</textarea><label class="mu"><input type="checkbox" ${p.c?"checked":""} onchange="plSet(${ti},${i},'c',this.checked);render()"> Captain</label></div>`:""}</div>`}).join("")||'<div class="mu">Add players in Setup.</div>'}</div></div>`).join("")}
function honour(){return `<h2>🏆 Roll of honour · 2026</h2>

let deferredInstallPrompt=null;

function appIsStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}

function updateInstallCard(){
  const el=$("#app-install");
  if(el)el.style.display=appIsStandalone()?"none":"flex";
}

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  updateInstallCard();
});

window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  const m=$("#app-install-modal");if(m)m.remove();
  updateInstallCard();
});

async function installApp(){
  if(appIsStandalone())return;
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice}catch(e){}
    deferredInstallPrompt=null;
    updateInstallCard();
    return;
  }
  showInstallHelp();
}

function showInstallHelp(){
  if($("#app-install-modal"))return;
  const ios=!!window.navigator.standalone||/iphone|ipad|ipod/i.test(navigator.userAgent);
  const guide=ios
    ?'<p class="mu">In Safari, tap <b>Share</b>, then choose <b>Add to Home Screen</b>.</p>'
    :'<p class="mu">Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>.</p>';
  document.body.insertAdjacentHTML("beforeend",`<div id="app-install-modal" class="install-modal" onclick="if(event.target===this)this.remove()">
    <div class="card">
      <img src="icons/lashbury-cup-icon.png" alt="The Lashbury Cup">
      <h2>Install The Lashbury Cup</h2>
      ${guide}
      <button class="b p" style="margin-top:8px" onclick="document.querySelector('#app-install-modal').remove()">Got it</button>
    </div>
  </div>`);
}

function installCard(){
  if(appIsStandalone())return "";
  return `<div id="app-install" class="card app-install">
    <img src="icons/lashbury-cup-icon.png" alt="The Lashbury Cup">
    <div style="flex:1"><h2 style="margin:0">Install the Cup</h2><div class="mu">Add the Lashbury Cup to your Home Screen.</div></div>
    <button class="b p" onclick="installApp()">Install</button>
  </div>`;
}

function welcomeCountdown(){
  const [y,m,d]=dates()[0].split("-").map(Number);
  const target=Date.UTC(y,m-1,d,9,0);
  const diff=Math.max(0,target-Date.now());
  const total=Math.floor(diff/1000),days=Math.floor(total/86400),hours=Math.floor(total%86400/3600),mins=Math.floor(total%3600/60),secs=total%60;
  return days>0?days+"d "+String(hours).padStart(2,"0")+"h "+String(mins).padStart(2,"0")+"m":hours+"h "+String(mins).padStart(2,"0")+"m "+String(secs).padStart(2,"0")+"s";
}
function updateWelcomeCountdown(){const el=$("#welcome-countdown");if(el)el.textContent=welcomeCountdown()}
function vTeams(){
  return `<div class="banner"><h1>Teams</h1><div class="mu">The Lashbury Cup 2027</div></div>

}

  $("#app").innerHTML=`<div class="banner" style="--g:linear-gradient(90deg,${S.teams[0].color},${S.teams[1].color})"><img src="${LOGO}" alt="The Lashbury Cup 2027"></div>`+(!loaded?`<p class="mu" style="text-align:center">Loading…</p>`:`<div class="card" style="text-align:center"><h2>🔒 Enter the PIN</h2><div class="mu">Ask the organiser for the PIN to view The Lashbury Cup.</div><input id="gp" type="password" autocomplete="off" placeholder="PIN" style="width:70%;margin:10px 0;text-align:center;font-size:20px" onkeydown="if(event.key==='Enter')guestPin()"><br><button class="b p" onclick="guestPin()">Enter</button>${gateErr?'<div style="color:#d64545;margin-top:8px">Wrong PIN, try again</div>':""}</div><p class="mu" style="text-align:center"><a href="#" onclick="login();return false">Admin login</a></p>`)}
function addEv(){if(!owner)return;const n=$("#en").value.trim();if(!n)return;S.events.push({id:uid(),name:n,type:$("#et").value,points:+$("#ep").value||0,day:+$("#ed").value||0,time:$("#eh").value,matches:[]});save()}
function setPtsQ(id,v){S.events.find(e=>e.id===id).points=+v||0;saveQuiet()}
function setPts(id,v){S.events.find(e=>e.id===id).points=+v||0;save()}
const locked=e=>e.spurs?spLocked(e):[e,e.link?S.events.find(x=>x.id===e.link):null].some(x=>x&&((x.matches||[]).some(m=>m.w!==null)||Object.keys(x.po||{}).length>0));
function doDraw(id){
  const e=S.events.find(x=>x.id===id),q=e.link?S.events.find(x=>x.id===e.link):null;
  if(e.spurs&&!locked(e)){if(e.sp&&e.sp.slots&&e.sp.slots.length&&!confirm("Redraw who predicts what?"))return;spDraw(e);return}
  if(locked(e)){alert("Draw locked: results have been entered"+(q?" for "+e.name+" or "+q.name:"")+". Remove them first if you really need to redraw.");return}
  if((e.matches||[]).length&&!confirm("This replaces the existing draw"+(q?" for "+e.name+" and "+q.name:"")+". Redraw?"))return;
  draw(e);showDraw(e)}
function delEv(id){if(!owner)return;if(confirm("Delete event?")){S.events=S.events.filter(e=>e.id!==id);save()}}
function sendMsg(w){const t=$("#msg").value.trim();if(!t)return;post(t);if(w)wa(t);save()}
function render(auto){owner=admin&&(!S.ownerHash||LS.get("tt_owner")===S.ownerHash);if(!owner&&(tab==="mvp"||tab==="setup"))tab="league";{const n=LS.get("tt_team");myTeam=(n!==null&&n!==""&&S.tp&&S.tp[+n]&&LS.get("tt_tc")===S.tp[+n])?+n:null}
  if(!loaded||gated()){gateView();return}if(auto&&((ytOn&&document.querySelector("#yt iframe"))||(mapOn&&document.querySelector("#mp iframe"))))return;
  const v={welcome:vWelcome,teams:vTeams,league:vLeague,events:vEvents,pub:vPub,mvp:vMvp,feed:vFeed,setup:vSetup,timetable:timetable}[tab];
  const a=document.activeElement;if(a&&a.tagName==="TEXTAREA"&&a.id==="msg"&&a.value)return;
  ytOn=false;const y=window.scrollY;$("#app").innerHTML=v();window.scrollTo(0,y);if(tab==="mvp"&&S.mvp&&!fired){fired=true;confetti()}
  const tabs=[["welcome","🏠 Welcome"],["teams","👥 Teams"],["league","🏆 League"],["events","📊 Results"],["pub","🍻 Pub Golf"],["feed","💬 Updates"]];if(owner)tabs.splice(4,0,["mvp","⭐ MVP"]);if(owner)tabs.push(["setup","⚙️ Setup"]);
  $("#nav").innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()"><span style="font-size:17px;display:block">${l.split(" ")[0]}</span>${l.split(" ").slice(1).join(" ")}</button>`).join("")+(admin&&!owner?`<button onclick="ownerLogin()"><span style="font-size:17px;display:block">🔐</span>Owner</button>`:"");
}
try{const c=JSON.parse(LS.get("tt_local")||"null");if(c&&c.s&&c.s.teams)S=c.s}catch(e){}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
admin=!!LS.get("tt_token");{const mt=LS.get("tt_team");myTeam=mt===null||mt===""?null:+mt}
try{ADM=JSON.parse(LS.get("tt_adm")||"{}")}catch(e){}
try{const l=JSON.parse(LS.get("tt_local")||"null");if(admin&&l&&l.dirty&&l.s){S=l.s;dirty=true}}catch(e){}
render();status();load().finally(()=>{migrate()});if(dirty)push();
