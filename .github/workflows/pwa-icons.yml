name: Generate PWA icons

on:
  push:
    paths:
      - "icons/lashbury-cup-icon.png"
      - ".github/workflows/pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate 192px and 512px icons
        run: |
          python - <<'PY'
          from PIL import Image
          src = Image.open("icons/lashbury-cup-icon.png").convert("RGBA")
          src.resize((192, 192), Image.Resampling.LANCZOS).save("icons/icon-192.png", optimize=True)
          src.resize((512, 512), Image.Resampling.LANCZOS).save("icons/icon-512.png", optimize=True)
          PY

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          git diff --cached --quiet || git commit -m "Generate standard PWA icon sizes"
          git push
