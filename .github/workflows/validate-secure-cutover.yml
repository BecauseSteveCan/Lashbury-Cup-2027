name: Validate secure cutover front end

on:
  push:
    branches:
      - security-cutover-review
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/validate-secure-cutover.yml'

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.blocks.append("".join(self.parts))
                      self.in_script = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text())
          blocks = [block for block in parser.blocks if block.strip()]
          if not blocks:
              raise SystemExit("No inline script found")
          Path("/tmp/inline.js").write_text("\n".join(blocks))
          print(f"Extracted {len(blocks)} inline script block(s)")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/inline.js
